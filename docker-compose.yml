version: "3.8"

services:

  # ── Main development environment ─────────────────────────────
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delta-chronicle-dev
    entrypoint: ""
    volumes:
      # Mount source code so edits on Windows reflect instantly inside container
      - .:/app
      # Persist Delta tables between container runs
      - delta-data:/app/demo/nyc_taxi/delta
    environment:
      - SPARK_LOCAL_IP=127.0.0.1
      - PYTHONPATH=/app
      - PYSPARK_PYTHON=python3
    stdin_open: true
    tty: true
    command: bash

  # ── Test runner ────────────────────────────────────────────
  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delta-chronicle-test
    entrypoint: ""
    volumes:
      - .:/app
    environment:
      - SPARK_LOCAL_IP=127.0.0.1
      - PYTHONPATH=/app
      - PYSPARK_PYTHON=python3
    command: python3 -m pytest tests/unit/ -v --tb=short --cov=delta_chronicle --cov-report=term-missing

  # ── Pipeline runner ────────────────────────────────────────
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delta-chronicle-pipeline
    entrypoint: ""
    volumes:
      - .:/app
      - delta-data:/app/demo/nyc_taxi/delta
    environment:
      - SPARK_LOCAL_IP=127.0.0.1
      - PYTHONPATH=/app
      - PYSPARK_PYTHON=python3
    command: python3 demo/nyc_taxi/pipeline.py
  inject:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delta-chronicle-inject
    entrypoint: ""
    volumes:
      - .:/app
      - delta-data:/app/demo/nyc_taxi/delta
    environment:
      - SPARK_LOCAL_IP=127.0.0.1
      - PYTHONPATH=/app
      - PYSPARK_PYTHON=python3
    command: python3 demo/nyc_taxi/inject_anomaly.py
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: delta-chronicle-demo
    entrypoint: ""
    volumes:
      - .:/app
      - delta-data:/app/demo/nyc_taxi/delta
    environment:
      - SPARK_LOCAL_IP=127.0.0.1
      - PYTHONPATH=/app
      - PYSPARK_PYTHON=python3
    command: python3 demo/nyc_taxi/chronicle_demo.py
  explore:
    build: .
    container_name: delta-chronicle-explore
    entrypoint: ""
    volumes:
      - .:/app
      - delta-data:/app/demo/nyc_taxi/delta
    environment:
      - SPARK_LOCAL_IP=127.0.0.1
      - SPARK_HOME=/opt/spark
      - PYTHONPATH=/app:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
      - PYSPARK_PYTHON=python3
    command: python3 demo/nyc_taxi/explore_cdf.py

volumes:
  delta-data: